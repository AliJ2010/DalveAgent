name: Build installers

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# The default GITHUB_TOKEN is read-only unless explicitly granted write access — without this,
# the release-publish step fails with a permissions error even though the build itself succeeds.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false # one platform's release-publish hiccup shouldn't cancel the other's build
      # Both platforms publish to the SAME version tag, and electron-builder's GitHub publisher
      # isn't race-safe: two processes hitting "create this release" for the same brand-new tag
      # at once causes one to lose (422 "Published releases must have a valid tag"). Sequential
      # execution means the second job's electron-builder always finds the tag the first job
      # already created and just adds its assets to it instead of racing to create it too.
      max-parallel: 1
      matrix:
        include:
          - os: windows-latest
            script: build:win:publish
          - os: macos-latest
            script: build:mac:publish
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # Every push gets its own strictly-increasing version (0.1.<run number>) purely so the
      # in-app auto-updater has something to compare against — nobody has to remember to bump
      # package.json by hand. This only edits the ephemeral CI checkout, never the repo.
      - run: npm pkg set version=0.1.${{ github.run_number }}

      # electron-builder uploads the installer and its .blockmap concurrently, and each upload
      # independently checks "does the release exist yet?" — when both check at once and both
      # get "no", both try to create it and the loser gets a 422 ("Published releases must have
      # a valid tag"), which killed the whole publish step even though the actual build was fine.
      # Pre-creating the release means that check always finds "yes" instead, so there's nothing
      # left to race over. `|| true` because this legitimately fails on the second OS in the
      # matrix once the first one has already created it — that's expected, not an error.
      - name: Ensure GitHub release exists for this version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release create "v$VERSION" --title "DALVE $VERSION" --notes "Automated build" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # electron-builder's own --publish (not a separate upload action) is what makes real
      # auto-update possible: it creates/updates a proper versioned GitHub release AND generates
      # the latest.yml / latest-mac.yml update-feed files electron-updater reads. Both OS jobs
      # publish to the same release (matched by version); electron-builder adds assets rather
      # than replacing the release, so Windows and Mac builds don't clobber each other.
      - run: npm run ${{ matrix.script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
