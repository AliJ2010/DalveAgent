name: Build installers

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# The default GITHUB_TOKEN is read-only unless explicitly granted write access — without this,
# the release-publish step fails with a permissions error even though the build itself succeeds.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false # one platform's release-publish hiccup shouldn't cancel the other's build
      matrix:
        include:
          - os: windows-latest
            script: build:win
          - os: macos-latest
            script: build:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run ${{ matrix.script }}

      - uses: actions/upload-artifact@v4
        with:
          name: dalve-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
          if-no-files-found: ignore

      # Publishes straight to a permanent public "latest" release on every push — this is what
      # makes it a real download link instead of something only reachable via `gh`/API auth.
      # Both OS jobs upload to the SAME release tag; action-gh-release adds to an existing
      # release's assets rather than replacing the whole thing, so Windows and Mac builds don't
      # clobber each other.
      - name: Publish to latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: DALVE
          prerelease: true
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
