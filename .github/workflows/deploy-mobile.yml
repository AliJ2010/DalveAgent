name: Deploy mobile web app

on:
  push:
    branches: [main, master]
    paths:
      - 'mobile/**'
      - '.github/workflows/deploy-mobile.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          # Attempts to enable Pages via the API if it isn't already — may still fail with only
          # the default GITHUB_TOKEN's permissions, in which case Settings -> Pages -> Source ->
          # "GitHub Actions" needs to be set by hand once (repo admin only, not available to me).
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: mobile

      - id: deployment
        uses: actions/deploy-pages@v4
