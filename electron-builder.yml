appId: me.dalve.app
productName: DALVE
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
  - node_modules/robotjs/**
  # tesseract.js loads its worker script and WASM core from real file paths at runtime — same
  # class of problem robotjs had — so it needs to live outside the asar archive too.
  - node_modules/tesseract.js/**
  - node_modules/tesseract.js-core/**
  # Porcupine (wake word) loads a prebuilt native shared library per-platform from a real file
  # path at runtime, plus the built-in .ppn keyword files — same class of problem as the above.
  - node_modules/@picovoice/porcupine-node/**
# Playwright's actual browser binary lives outside node_modules and isn't part of electron-
# builder's normal file selection at all. Bundled via afterPack (build/afterPack.js) — a plain
# post-packaging file copy — rather than `files`/`extraResources`: confirmed empirically that
# adding `extraResources` to this config, even alone with `files` fully unchanged, made
# electron-builder silently drop its own default file selection and exclude the app's own entry
# point (out/main/index.js) from the package. afterPack runs after that selection is already
# decided, so it can't trigger the same failure.
afterPack: build/afterPack.js
win:
  executableName: DALVE
nsis:
  # Version-free filename on purpose: the download page links directly to this exact name via
  # GitHub's "latest release" redirect (github.com/OWNER/REPO/releases/latest/download/<name>),
  # which always serves the newest release's asset. A versioned filename would 404 every time
  # the version bumps, since old release assets keep their own literal name forever.
  artifactName: ${productName}-Setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
  # zip is required by Squirrel.Mac (the mac auto-update mechanism) alongside the dmg — it's
  # what the in-app updater actually downloads and applies; the dmg stays for manual installs.
  target:
    - dmg
    - zip
dmg:
  artifactName: ${productName}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: AliJ2010
  repo: DalveAgent
  # Without this, electron-builder's GitHub publisher creates the release as a DRAFT by
  # default — invisible to everyone but the repo owner, and invisible to /releases/latest, which
  # is exactly why the last run's release silently never showed up anywhere.
  releaseType: release
