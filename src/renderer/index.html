<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>DALVE</title>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <!-- script-src additions are for MediaPipe's hand-tracking runtime (@mediapipe/tasks-vision):
         its WASM loader ships via jsdelivr's CDN rather than bundled, and 'wasm-unsafe-eval' is
         required by spec for any WebAssembly.instantiate call under a strict CSP. connect-src
         additions let it fetch that WASM binary plus the actual hand-landmark model file, which
         Google hosts on Cloud Storage rather than distributing through npm. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://cdn.jsdelivr.net; connect-src 'self' https://cdn.jsdelivr.net https://storage.googleapis.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
